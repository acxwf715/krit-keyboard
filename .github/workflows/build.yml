
name: Build Krit Keyboard

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Keyman compiler
        run: npm install -g @keymanapp/kmc

      - name: Compile keyboard
        run: kmc build krit.kmn

      - name: Build installation package
        run: kmc build krit.kps

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Krit-iPhone-Keyboard
          path: '*.kmp'
          if-no-files-found: error
